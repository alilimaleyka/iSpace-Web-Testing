# ============================================================
#  Layihə konfiqurasiyası — ÖZ LAYİHƏNİZƏ UYĞUN DƏYİŞİN
#  Bütün açarlar kodda utils.Config ilə, spec-lərdə ${env.açar} ilə oxunur.
#  Komanda sətrindən override (environment variable): browser=firefox mvn test
# ============================================================

# ---------- UI ----------
# Nisbi ünvanlar ("/login") bu URL-ə birləşdirilir
ui_base_url = https://ispace.az/
# chrome | firefox | edge | safari  (sonuna -headless əlavə etmək olar: chrome-headless)
browser = chrome
headless = false
# Element gözləmələrinin default müddəti (saniyə)
explicit_wait_seconds = 10
# true olarsa ssenari bitəndə brauzer avtomatik bağlanmır (debug üçün)
keep_browser_open = false

# ---------- API ----------
# Nisbi endpoint-lər ("/users") bu URL-ə birləşdirilir
api_base_url = https://api.anarabbas.com
# Server cavab vermədikdə maksimum gözləmə (saniyə)
api_timeout_seconds = 30
# 429 / 503 cavablarında təkrar cəhd sayı
api_max_retries = 2
# Server Retry-After ilə daha uzun gözləmə istəsə belə bir cəhd üçün maksimum (saniyə)
api_retry_max_wait_seconds = 10
# Hər sorğunu və cavabı konsola tam yazdır
api_log_all = true
# Self-signed sertifikatlı test serverləri üçün true
api_relaxed_https = false
